name: CI

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Lint, type check, build, smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bus_booking
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bus_booking
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx next typegen && npx tsc --noEmit

      - name: Migrate database (twice, to prove it's idempotent)
        run: npm run db:migrate && npm run db:migrate

      - name: Seed database
        run: npm run db:seed

      - name: Build
        run: npm run build

      - name: Start app
        run: |
          npm start > app.log 2>&1 &
          npx --yes wait-on --timeout 60000 http://localhost:3000/api/auth/me

      - name: Smoke test
        run: npm run smoke

      - name: Show app log on failure
        if: failure()
        run: cat app.log || true
